on:
  push:
    branches: [ main, stable ]
  pull_request:
    branches: [ main, stable ]
  schedule:
    # Monthly at 00:00 UTC on the 1st day of the month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Type of release to create'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - rc
          - prod
      dry-run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean
